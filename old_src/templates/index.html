                            <span>中文</span>
                            <i class="anticon xy_icon"></i>
                        </div>
                    </div>
                </div>
                <i aria-label="图标: double-right" title="收起菜单" tabindex="-1" ></i>
            </div>



            <!-- 下方内容部分 -->
            <div class="aia_course_home_container">
                <!-- 正式内容部分 -->
                <div class="aia_course_home_content">
                    <!-- 用户信息标签 -->
                    <div class="aia_course_home_count_panel">
                        <div class="user_info">
                            <div class="img_container">
                                <img src="../statics/pictures/头像.jpg" alt="用户头像" class="user_avatar">
                            </div>
                            <div class="name_school_container">
                                <span class="variable_content">倪锋</span>
                                <span>武汉理工大学</span>
                            </div>
                            
                        </div>
                        <div class="courses_and_tasks">
                            <div class="courses">
                                <span class="variable_content">60</span>
                                <span class="title">学习课程</span>
                            </div>
                            <div class="tasks">
                                <span class="variable_content">15</span>
                                <span class="title">待完成任务</span>
                            </div>
                        </div> 
                        <div class="new_message">
                            <span class="variable_content">0</span>
                            <span class="title">未读消息</span>
                        </div>
                    </div>
                    <!-- 课程导航栏 -->
                    <div class="course_nav">
                        <div class="nav_item_container">
                            <div class="nav_item active">
                                我学的课
                            </div>
                            <div class="nav_item">
                                收藏的课
                            </div>
                            <div class="nav_item">
                                访问的课
                            </div>
                        </div>
                        
                        <div class="search_container">
                            <div class="search_box">
                                <div class="search_img">
                                    <img src="../statics/pictures/search.jpg" alt="搜索图标">
                                </div>
                                <input type="text" placeholder="请搜索课程" class="search_input">
                            </div>

                            <button class="join_course_button" title="加入课程" type="button">加入课程</button>
                        </div>

                        
                    </div>
                </div>


                <!-- 下方用户协议部分 -->
                <div class="portal_footer">
                    <div class="container">
                        <div class="tools">
                            <a target="_blank" rel="noopener noreferrer" href="https://www.ai-augmented.com/user-agreement.html">用户协议</a>
                            <a target="_blank" rel="noopener noreferrer" href="/app/jx-web/mycourse/teachingvideos">使用帮助</a>
                        </div>
                        <div class="outdated_browser">

                        </div>
                        <div class="content">

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 浮动出现部分 -->
    <div class="ant-dropdown ant-dropdown-placement-bottomLeft ant-dropdown-hidde">
        <ul role="menu" class="ant-dropdown-menu">
            <!-- 这里的item还应该有一个ant-dropdown-menu-item-active，但我不清楚这个能干什么 -->
            <li role="menuitem" class="ant-dropdown-menu-item">
                <a>课程中心</a>
            </li>
            <li role="menuitem" class="ant-dropdown-menu-item">
                <a>应用中心</a>
            </li>
        </ul>
    </div>
